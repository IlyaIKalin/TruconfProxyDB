spring:
  application:
    name: truconf-proxydb
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/truconf_proxydb}
    username: ${SPRING_DATASOURCE_USERNAME:truconf_proxydb}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:100MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:110MB}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

truconf:
  bot-http-base-url: ${TRUCONF_BOT_HTTP_BASE_URL:https://s13.trueconf.rt.ru}
  bot-ws-url: ${TRUCONF_BOT_WS_URL:wss://s13.trueconf.rt.ru/websocket/chat_bot/}
  bot-client-id: ${TRUCONF_BOT_CLIENT_ID:change-me}
  bot-username: ${TRUCONF_BOT_USERNAME:bot-user}
  bot-password: ${TRUCONF_BOT_PASSWORD:change-me}
  proxy-api-key: ${TRUCONF_PROXY_API_KEY:change-me}
  file-storage-dir: ${TRUCONF_FILE_STORAGE_DIR:/var/lib/truconf-proxydb/files}
  tls-insecure-skip-verify: ${TRUCONF_TLS_INSECURE_SKIP_VERIFY:false}
  dispatcher:
    enabled: ${TRUCONF_DISPATCHER_ENABLED:true}
    batch-size: ${TRUCONF_DISPATCHER_BATCH_SIZE:50}
    poll-interval: ${TRUCONF_DISPATCHER_POLL_INTERVAL:5s}
    lock-timeout: ${TRUCONF_DISPATCHER_LOCK_TIMEOUT:2m}
    worker-threads: ${TRUCONF_DISPATCHER_WORKER_THREADS:4}
  retry:
    max-attempts: ${TRUCONF_RETRY_MAX_ATTEMPTS:10}
    initial-delay: ${TRUCONF_RETRY_INITIAL_DELAY:5s}
    max-delay: ${TRUCONF_RETRY_MAX_DELAY:5m}
    multiplier: ${TRUCONF_RETRY_MULTIPLIER:2.0}
  rate-limit:
    commands-per-second: ${TRUCONF_RATE_LIMIT_COMMANDS_PER_SECOND:10}
  websocket:
    request-timeout: ${TRUCONF_WEBSOCKET_REQUEST_TIMEOUT:30s}
    connect-timeout: ${TRUCONF_WEBSOCKET_CONNECT_TIMEOUT:10s}
    reconnect-delay: ${TRUCONF_WEBSOCKET_RECONNECT_DELAY:5s}
  server-api:
    base-url: ${TRUCONF_SERVER_API_BASE_URL:https://s13.trueconf.rt.ru}
    client-id: ${TRUCONF_SERVER_API_CLIENT_ID:change-me}
    client-secret: ${TRUCONF_SERVER_API_CLIENT_SECRET:change-me}
    grant-type: ${TRUCONF_SERVER_API_GRANT_TYPE:client_credentials}
    username: ${TRUCONF_SERVER_API_USERNAME:}
    password: ${TRUCONF_SERVER_API_PASSWORD:}
    page-size: ${TRUCONF_SERVER_API_PAGE_SIZE:100}
    max-scan-pages: ${TRUCONF_SERVER_API_MAX_SCAN_PAGES:20}
  active-directory:
    enabled: ${TRUCONF_AD_ENABLED:false}
    url: ${TRUCONF_AD_URL:ldap://ad.example.local:389}
    bind-dn: ${TRUCONF_AD_BIND_DN:}
    bind-password: ${TRUCONF_AD_BIND_PASSWORD:}
    base-dn: ${TRUCONF_AD_BASE_DN:DC=example,DC=local}
    email-attribute: ${TRUCONF_AD_EMAIL_ATTRIBUTE:mail}
    trueconf-id-attribute: ${TRUCONF_AD_TRUECONF_ID_ATTRIBUTE:extensionAttribute5}
    display-name-attribute: ${TRUCONF_AD_DISPLAY_NAME_ATTRIBUTE:displayName}
    connect-timeout: ${TRUCONF_AD_CONNECT_TIMEOUT:3s}
    read-timeout: ${TRUCONF_AD_READ_TIMEOUT:5s}
